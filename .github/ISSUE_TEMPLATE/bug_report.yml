name: "🐛 Bug report"
description: Create a report to help us improve Woven Words
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of what the bug is.
      placeholder: e.g., Post creation fails when upload image exceeds limit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '/create-post'
        2. Click on '...'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: If applicable, add screenshots or console output to help explain your problem.
  - type: dropdown
    id: environment
    attributes:
      label: Browser / OS
      options:
        - Chrome / Windows
        - Chrome / macOS
        - Firefox
        - Safari
        - Edge
        - Other
